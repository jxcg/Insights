name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# a newer push to a PR makes its older run pointless. Pushes to main are never
# cancelled, so every merged commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # the app targets iOS 27.2, which needs the iOS 27.2 SDK. Only the Xcode 27
    # image carries it; macos-latest still defaults to Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          xcrun simctl list runtimes

      # `xcodebuild test` builds first, so a separate build job would compile
      # everything twice. The suite is pure Swift with no device-specific
      # behaviour, so one simulator is enough. The script finds, or on CI
      # creates, an iPhone simulator at or above the deployment target.
      - name: Build and test
        run: |
          set -o pipefail
          scripts/test.sh 2>&1 | tee xcodebuild.log

      # exact pass and fail counts, and every line a test printed starting
      # with "CI:", read from the result bundle: the console listing can come
      # out incomplete, and test output never reaches it
      - name: Test summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          result="$(ls -td build/DerivedData/Logs/Test/*.xcresult 2>/dev/null | head -1 || true)"
          [ -n "$result" ] || exit 0
          xcrun xcresulttool get test-results summary --path "$result" || true
          # Unit-test stdout lives in exported diagnostics, not the console log.
          diagnostics="$(mktemp -d)" || exit 0
          trap 'rm -rf "$diagnostics" || true' EXIT
          xcrun xcresulttool export diagnostics --path "$result" --output-path "$diagnostics/logs" >/dev/null || exit 0
          find "$diagnostics/logs" -type f -name '*StandardOutputAndStandardError*' \
            -exec grep -ah '^CI:' {} + || true

      # unit tests never launch the app; this does, and fails if it does not
      # stay running
      - name: Screenshots
        run: scripts/screenshots.sh screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      # small JPEG copies in the log, for anyone who can read the log but not
      # download artifacts. Each sits between PREVIEW-BEGIN and PREVIEW-END.
      - name: Print screenshot previews
        if: always()
        run: |
          shopt -s nullglob
          for shot in screenshots/*.png; do
            name="$(basename "$shot" .png)"
            sips -s format jpeg -s formatOptions 55 -Z 640 "$shot" --out "/tmp/$name.jpg" >/dev/null || continue
            echo "PREVIEW-BEGIN $name"
            base64 -i "/tmp/$name.jpg" | fold -w 120
            echo "PREVIEW-END $name"
          done

      # the full log runs to thousands of lines; this keeps the cause findable
      - name: Summarise failures
        if: failure()
        run: |
          grep -E "error:|warning: .*deprecated|✘|failed|FAILED" xcodebuild.log | head -100 || true
