name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # `xcodebuild test` builds first, so a separate build job would compile
      # everything twice on a runner billed at 10x standard minutes. The suite
      # is pure Swift with no device-specific behaviour, so one simulator is
      # enough.
      - name: Build and test
        run: |
          xcodebuild test \
            -project Insights/Insights.xcodeproj \
            -scheme Insights \
            -destination 'platform=iOS Simulator,name=iPhone 17'
